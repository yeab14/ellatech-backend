version: '3.9'

services:
  postgres:
    image: postgres:18
    container_name: ellatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ellatech
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ellatech-api
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ellatech
    ports:
      - '3001:3000'
    depends_on:
      - postgres
    command: >
      sh -c "npm install && npm run migration:run && npm run start:dev"

volumes:
  postgres-data:
